# fly.toml app configuration file generated for sportmatchapi on 2026-06-09T10:00:46+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sportmatchapi'
primary_region = 'nrt'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 512

  [mounts]
  source = "sportmatch_data"
  destination = "/App/wwwroot/avatars"
